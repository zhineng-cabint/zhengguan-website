backend:
  name: git-gateway
  branch: main

media_folder: ""
public_folder: ""

collections:
  - name: "products"
    label: "产品管理"
    files:
      - name: "product_list"
        label: "所有产品列表"
        file: "products.json"
        fields:
          - label: "产品列表"
            name: "products"
            widget: "list"
            fields:
              - {label: "产品名称", name: "name", widget: "string"}
              - {label: "标签", name: "tag", widget: "string"}
              - {label: "产品描述", name: "desc", widget: "text"}
              - {label: "产品图片", name: "image", widget: "image"}
